    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1989fa" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>记账本</title>
    <script>
      // 页面加载前立即清理缓存和服务线程
      (function() {
        var v = localStorage.getItem('_v')
        if (v !== '3') {
          localStorage.setItem('_v', '3')
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function(r) {
              r.forEach(function(s) { s.unregister() })
            })
          }
          if (window.caches) {
            caches.keys().then(function(n) { n.forEach(function(k) { caches.delete(k) }) })
          }
        }
      })()
    </script>

    <link rel="stylesheet" crossorigin href="/bookkeeping/assets/index-OyMsmSSS.css">

  </body>
</html>
